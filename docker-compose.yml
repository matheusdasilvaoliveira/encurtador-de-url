version: '3.8'

services:
  # Serviço da nossa API Node.js
  api:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Mapeia a pasta local para dentro do contêiner (Hot Reload)
      - .:/usr/src/app
      # Protege os node_modules do contêiner de serem sobrescritos
      - /usr/src/app/node_modules
    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db

  # Serviço do Banco de Dados SQL
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: